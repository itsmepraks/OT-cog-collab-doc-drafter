# Created by cog-smith. Built against openteams/cog-manifest [0.1]; emits the
# envelope-v1 result contract (Collab profile — see cog-smith/ENVELOPE.md).

schema: openteams/cog-manifest [0.1]
id: openteams/cog-collab-docs-drafter
version: "0.1.0"
summary: >
  Drafts Collab release notes from supplied release evidence, links every claim to its source, and flags missing or conflicting information.
license: Apache-2.0

kind: context

owner: bankoleebenezer111@gmail.com
# The editorial and evidence rules come from the "Collab Release Documentation
# Quality" Frame (maintained by Prakriti Bista). How a manifest lists Frames is
# not settled yet (Trent, Sept 2026), so it stays empty and context/system.md
# carries the rules.
frames: []

context:
  instructions: context/system.md
  input_schema: context/input-schema.json
  output_schema: context/output-schema.json
  output_example: context/output-example.json

# The requirement is a CAPABILITY; the named Cog is one satisfier, not the
# only one. `pixi run resolve` verifies the candidate and writes the binding
# record (model.json — gitignored installation state). A hosting environment
# may re-satisfy this with its own model cog.
requires:
  - capability: model-endpoint/openai-compatible
    locality: any
    satisfied_by:
      cog: openteams/cog-qwen35b-collab
      version: ">=0.1.0"
      source: ../models/cog-qwen35b-collab
    # Both satisfiers are Intelligence Hub offerings generated by
    # `cog-smith generate-descriptors`. Pick one with --satisfier.
    also_satisfied_by:
      - cog: openteams/cog-sonnet-gateway
        version: ">=0.1.0"
        source: ../models/cog-sonnet-gateway

# Entry points. `default: true` = the programmatic binding target. Tasks are
# labeled by audience: usage ops face users and the Op layer; lifecycle ops
# (resolve/serve/check/eval/test) face the hosting environment.
interfaces:
  - name: web-api
    kind: http-json
    task: serve
    endpoint: http://127.0.0.1:8120/ask
    audience: usage      # the endpoint is the usage surface; starting it is lifecycle
    default: true
  - name: cli
    kind: command
    task: ask
    audience: usage
  - name: health
    kind: command
    task: check
    audience: lifecycle

io:
  accepts: [release_evidence_bundle]
  produces: [release_notes_draft]

memory: none

# Evidence-tier boundary: prohibitions are structural today (no tool grants
# exist that could perform them); they become Guard-enforced when a hosting
# environment supplies tools.
prohibits:
  - send_external_message
  - modify_source_data
  - publish_release_notes
  - change_release_metadata

evaluation:
  fixtures:
    - evals/smoke.fixture.yaml
    - evals/thin-evidence.fixture.yaml
    - evals/prompt-injection.fixture.yaml
    - evals/internal-only.fixture.yaml
